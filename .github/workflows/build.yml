name: Build merged x64 DLLs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Build and package x64
        shell: pwsh
        run: ./build.ps1 -Platform x64
      - name: Upload DLL package
        uses: actions/upload-artifact@v7
        with:
          name: SickoMenu-merged-x64
          path: artifacts/x64/SickoMenu-merged-x64.zip
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-x64
          path: artifacts/x64/*.log
          if-no-files-found: ignore

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SickoMenu-merged-x64
          path: package
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: package/SickoMenu-merged-x64.zip
          fail_on_unmatched_files: true
